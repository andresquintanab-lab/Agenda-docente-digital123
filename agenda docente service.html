<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agenda Digital Docente (con service worker)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#020617" />
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png" />

  <!-- El contenido HTML/CSS es el mismo que en agenda docente.html, mantengo las mismas mejoras -->
  <!-- Para evitar duplicar todo el archivo en este ejemplo, usa el mismo contenido que agenda docente.html -->
  <style>
    /* Puedes usar el mismo CSS que en agenda docente.html */
  </style>
</head>
<body>
  <p>Esta versión está preparada para usar el service worker. Abre /agenda docente.html para la interfaz completa.</p>

  <script>
    // Registrar Service Worker para PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then((reg) => {
            console.log("ServiceWorker registrado:", reg.scope);
          })
          .catch((err) => {
            console.log("Error al registrar el service worker:", err);
          });
      });
    }
  </script>
</body>
</html>
